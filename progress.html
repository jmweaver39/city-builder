<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloverleaf Preview</title>
<style>
  :root { --bg:#0f1b26; --panel:#172735ee; --line:#28404f; --text:#e6eef4; --muted:#8fa6b5; --accent:#4fc3e8; --good:#5fd38d; --warn:#f0b64f; --bad:#f07167; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,-apple-system,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; }
  canvas:active { cursor:grabbing; }
  aside { position:fixed; top:12px; left:12px; bottom:12px; width:290px; max-width:calc(100vw - 24px); overflow:auto; padding:14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  aside.closed { bottom:auto; width:auto; }
  aside.closed > *:not(.top) { display:none; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .top button { flex:none; padding:4px 10px; }
  h1 { margin:0; font-size:18px; }
  h2 { margin:14px 0 6px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  label { display:block; margin:6px 0; color:var(--muted); }
  select, input[type=range] { width:100%; margin-top:3px; }
  select { padding:6px; color:var(--text); background:#0d1720; border:1px solid var(--line); border-radius:6px; }
  .check { display:flex; gap:7px; align-items:center; }
  .speeds { display:flex; gap:5px; }
  button { flex:1; padding:6px 0; color:var(--text); background:#0d1720; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  button.on { border-color:var(--accent); color:var(--accent); }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; font-variant-numeric:tabular-nums; }
  .row span:first-child { color:var(--muted); }
  .banner { margin-top:8px; padding:8px; border-radius:6px; background:#0d1720; border-left:3px solid var(--warn); }
  .banner.real { border-left-color:var(--good); }
  .banner.bad { border-left-color:var(--bad); overflow-wrap:anywhere; }
  .cap { display:flex; gap:8px; align-items:baseline; padding:2px 0; }
  .cap i { width:8px; height:8px; border-radius:50%; flex:none; background:var(--line); transform:translateY(-1px); }
  .cap.live i { background:var(--good); }
  a { color:var(--accent); }
  .hint { color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<aside>
  <div class="top"><h1>Cloverleaf preview</h1><button id="toggle">Hide</button></div>
  <div id="mode" class="banner"></div>
  <label>Scene<select id="scene"></select></label>
  <label>Traffic <b id="trafficValue">100%</b><input id="traffic" type="range" min="0" max="4" step="0.1" value="1" /></label>
  <label class="check"><input id="lanes" type="checkbox" /> Show lanes and turn paths</label>
  <div class="speeds" id="speeds"></div>
  <h2>This scene</h2>
  <div id="stats"></div>
  <h2>Built so far</h2>
  <div id="caps"></div>
  <div id="links"></div>
  <div class="hint">Drag to pan, scroll to zoom.</div>
</aside>
<script type="module" src="/src/preview/progress.ts"></script>
</body>
</html>
